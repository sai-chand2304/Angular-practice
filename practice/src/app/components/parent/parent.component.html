<p>parent works!</p>
<app-child [childMessage]="message"
            (todoChanged)="changed($event)"
            [todos]="todos"
            [pending]="pending"
            [completed]="completed"
        >
<p>This is using ng-content: Projecting from parent component</p>        
</app-child>


<h1>Add Todo</h1>
<form (ngSubmit)="addTodo()" #todoForm="ngForm">
    <div>
        <input type="text"
                [(ngModel)]="newTodo.title"
                name="title"
                placeholder="Enter todo title"
                required />
        <button type="submit" [disabled]="!todoForm.valid">Add todo</button>
    </div>
</form>
